<style>
:root{--g:#0f4d3a;--g2:#1b7a5a;--gl:#dff5e8;--r:#b8372a;--rs:#e8695c;--rl:#fde8e6;--bg:#f4f6f5;--c:#fff;--t:#17231e;--m:#66756e;--b:#e3e9e6;--sh:0 2px 10px rgba(15,77,58,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--g:#1f7a5c;--g2:#3fb98a;--gl:#12291f;--r:#d9534a;--rl:#2e1715;--bg:#0b0b0c;--c:#161618;--t:#ececec;--m:#9a9a9f;--b:#2a2a2e;--sh:none}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
/* Android: fondo blanco, sin zoom ni selección de texto */
:root{--bg:#fff;--c:#fff;--sh:0 1px 3px rgba(0,0,0,.1)}
html,body{background:#fff;font-family:Roboto,system-ui,"Segoe UI",sans-serif;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{user-select:text;-webkit-user-select:text}
.card{border:1px solid var(--b)}.bal{text-align:center}.hd{justify-content:center}.sum{align-items:center;text-align:center}
.btn:active,.chip:active,nav button:active,.dots:active,.opt:active{opacity:.65}
body.kb nav,body.kb .fab{display:none!important}
body.kb .layer>div.fx .fxb{padding-bottom:45vh}
/* Botones y menú forman un solo bloque fijo abajo, sin huecos */
#dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:5;background:var(--bg)}
#dock .fab,#dock nav{position:static;transform:none;width:auto;max-width:none;bottom:auto;left:auto}
form,input,textarea,select{scroll-margin-top:112px;scroll-margin-bottom:12px}
/* Cabecera fija con fechas y barra de acciones sobre el menú */
#top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:6;background:var(--bg);border-bottom:1px solid var(--b);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center}.brand h1{font-size:20px}.brand .logo{width:38px;height:38px;border-radius:12px;position:relative;overflow:hidden}.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dates{display:flex;align-items:center;gap:6px;margin-top:8px;overflow-x:auto;justify-content:center}
.dates .chip{padding:6px 11px;font-size:13px}
.calb{position:relative;width:40px;height:36px;display:grid;place-items:center;border-left:1px solid var(--b);margin-left:4px;color:var(--g2);flex:none}
.calb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;min-height:0;border:0}
#app{padding-top:104px;padding-bottom:170px}
.fab{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px;background:var(--bg);z-index:5}
.fab .btn{display:flex;align-items:center;justify-content:center;gap:8px}.fab .btn svg{width:26px;height:26px}
.fab .fin{background:var(--g)}.fab .fout{background:var(--rs);color:#2b0d09}.fab .cnt{background:var(--c);color:var(--g2);border:2px solid var(--g2);box-shadow:none}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 Roboto,system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:520px;margin:0 auto;padding:114px 16px 190px;min-height:100vh}
h1,h2,h3,p{margin:0}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center}
.hd h1{font-size:20px;font-weight:700}.hd p{color:var(--m);font-size:14px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bal{background:linear-gradient(135deg,var(--g),#0a3a2b);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--sh)}
.bal small{opacity:.8;font-weight:600;letter-spacing:.04em}
.bal .big{font-size:38px;font-weight:800;margin:6px 0;letter-spacing:-.02em}
.bal p{font-size:13px;opacity:.75}
.bal.neg{background:linear-gradient(135deg,#c0392b,#8c2a20)}
.chips{display:flex;gap:8px;margin:18px 0 10px;overflow-x:auto}
.chip{padding:7px 14px;border-radius:999px;background:var(--c);border:1px solid var(--b);font-size:14px;white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--c);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.sum{display:flex;flex-direction:column;gap:4px}.sum b{font-size:19px}.sum span{display:flex;align-items:center;gap:6px;font-size:14px}
.sum.in{background:var(--gl)}.sum.in svg,.sum.in b{color:var(--g2)}
.sum.out{background:var(--rl)}.sum.out svg,.sum.out b{color:var(--r)}
h2.sec{font-size:18px;margin:22px 0 10px}
.tabs{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:4px;background:var(--b);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{padding:10px 4px;border-radius:11px;font-weight:600;color:var(--m)}
.tabs .on{color:#fff;background:var(--g)}.tabs .on.o{background:var(--r)}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--b)}
.row:last-child{border:0}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .tx small{color:var(--m)}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--g2)}.amt.out{color:var(--r)}
.dots{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--m)}
.dots:hover{background:var(--b)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{min-height:52px;border-radius:16px;font-weight:700;color:#fff;background:var(--g);padding:0 14px}
.btn.red{background:var(--rs);color:#2b0d09}.btn.ghost{background:var(--b);color:var(--t)}.btn.dng{background:var(--r)}
.link{color:var(--g2);font-weight:600;padding:8px 0}
.empty{text-align:center;padding:28px 12px;color:var(--m)}.empty b{display:block;color:var(--t);margin:8px 0 4px;font-size:17px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(var(--nn,4),1fr);background:var(--c);border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--m);border-radius:12px}
nav button.on{color:var(--g2);font-weight:700}
.layer{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.layer>div{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:12px}.fh h2{font-size:20px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c);box-shadow:var(--sh)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--b);background:var(--c);min-height:48px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--g2);outline-offset:1px}
.amtin{font-size:28px;font-weight:800}
.err{color:var(--r);font-size:13px;min-height:16px;display:block;margin-top:4px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.shade.mid{align-items:center;padding:20px}
.sheet{background:var(--c);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.mid .sheet{border-radius:22px}
.sheet h3{margin-bottom:8px}.sheet .opt{display:flex;gap:12px;align-items:center;width:100%;padding:14px 8px;text-align:left;border-radius:12px;font-weight:600}
.sheet .opt:hover{background:var(--b)}.sheet .opt.d{color:var(--r)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:10px 0 16px}dt{color:var(--m)}dd{margin:0;font-weight:600;text-align:right;word-break:break-word}
#toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 18px;border-radius:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%}
#toast.bad{background:var(--r)}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;overflow-x:auto;padding-bottom:4px}
.bk{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;font-size:11px;color:var(--m)}
.bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bars i{display:block;width:45%;max-width:18px;border-radius:5px 5px 0 0;min-height:2px}
.bars .i{background:var(--g2)}.bars .o{background:var(--rs)}
textarea.box{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b)}
.sw{width:52px;height:30px;border-radius:999px;background:var(--b);position:relative;flex:none;transition:.2s}.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--g2)}.sw.on i{left:25px}
/* Formularios de inventario: tarjeta centrada */
.ctr{min-height:100%;display:flex;flex-direction:column}.ctr .fcard{margin:auto 0}
.fcard{background:var(--c);border:1px solid var(--b);border-radius:28px;padding:26px 20px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.fcard h2{text-align:center;font-size:22px}.fcard .sub{text-align:center;color:var(--m);font-size:14px;margin:4px 0 8px}
.ficon{width:64px;height:64px;border-radius:20px;background:var(--gl);color:var(--g2);display:grid;place-items:center;margin:0 auto 12px}.ficon svg{width:30px;height:30px}.ficon.out{background:var(--rl);color:var(--r)}
/* Formulario de venta/gasto: encabezado de color con el importe grande y hoja blanca debajo */
.layer>div.fx{padding:0;min-height:100%;display:flex;flex-direction:column}.fx form{flex:1;display:flex;flex-direction:column}
.fxh{background:linear-gradient(135deg,var(--g),#0a3a2b);color:#fff;padding:12px 20px 52px}.fxh.out{background:linear-gradient(135deg,#c0453a,#8c2a20)}
.fxt{display:flex;align-items:center;gap:12px;margin-bottom:18px}.fxt b{font-size:19px}.fxt .ib{background:rgba(255,255,255,.18);box-shadow:none;color:#fff}
.fxh label{color:rgba(255,255,255,.8);margin:0 0 4px}.fxh .err{color:#ffe1dd}
.pf2{display:flex;align-items:center;gap:8px}.pf2 span{font-size:38px;font-weight:800;opacity:.8}.pf2 input{background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.5);border-radius:0;color:#fff;font-size:42px;font-weight:800;padding:0 0 4px;min-height:0}.pf2 input::placeholder{color:rgba(255,255,255,.45)}.pf2 input:focus{outline:0;border-bottom-color:#fff}
.fxb{flex:1;background:var(--bg);border-radius:28px 28px 0 0;margin-top:-28px;padding:8px 20px 40px}
/* Formularios como hoja inferior: simples, compactos y con el botón Guardar siempre a la vista */
@keyframes up{from{transform:translateY(40px);opacity:0}}
.layer:has(.fx),.layer:has(.ctr){background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.layer>div.fx,.layer>div.ctr{width:100%;min-height:0;max-height:94%;overflow:auto;background:var(--c);border-radius:28px 28px 0 0;padding:0;animation:up .25s ease-out}
.layer>div.fx::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--b);margin:10px auto 0;flex:none}
.layer>div.ctr{padding:10px 20px 24px}
.ctr .fcard{box-shadow:none;border:0;background:none;padding:0;margin:0}
.fx .fxh,.fx .fxh.out{background:none;color:var(--t);padding:8px 20px 0}
.fx .fxt{margin-bottom:6px}.fx .fxt b{font-size:18px;color:var(--g2)}.fx .fxh.out .fxt b{color:var(--r)}
.fx .fxt .ib{background:var(--b);color:var(--t);width:40px;height:40px;border-radius:12px}
.fx .fxh label{color:var(--m);font-size:13px;margin:0 0 2px}.fx .fxh .err{color:var(--r)}
.fx .pf2 span{color:var(--m);font-size:30px}.fx .pf2 input{color:var(--t);font-size:36px;border-bottom:2px solid var(--b)}.fx .pf2 input::placeholder{color:var(--m);opacity:.5}.fx .pf2 input:focus{border-bottom-color:var(--g2)}
.fx .fxb{background:none;border-radius:0;margin:0;padding:0 20px 14px}
.fxb label,.ctr label{font-size:13px;color:var(--m);margin:12px 0 5px}
.fxb input,.fxb textarea,.fxb select,.ctr input,.ctr textarea,.ctr select{background:var(--b);background:color-mix(in srgb,var(--b) 55%,transparent);border-color:transparent;min-height:46px}
.fxb input:focus,.fxb textarea:focus,.fxb select:focus,.ctr input:focus,.ctr textarea:focus,.ctr select:focus{border-color:var(--g2);background:var(--c)}
.fxb .acts{position:sticky;bottom:0;background:var(--c);padding:10px 0 4px;margin-top:14px;grid-template-columns:1fr 2fr}
.il{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:16px;border:1px solid var(--b);margin-bottom:8px}.il select{flex:1 1 100%}.il .step{flex:1}.il .step input{width:100%;min-width:0}.il .step button{width:44px;min-height:44px}
.pk{display:flex;align-items:center;gap:12px;padding:12px 6px;margin:0;border-bottom:1px solid var(--b);font-size:16px;color:var(--t)}.pk input{width:24px;height:24px;min-height:0;padding:0;flex:none;accent-color:var(--g2)}.pk small{display:block;color:var(--m);font-weight:400}.pk:has(input:disabled){opacity:.45}
.pf{position:relative}.pf span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:800;font-size:22px;color:var(--m)}.pf input{padding-left:38px}
.step{display:flex;gap:10px;align-items:center}.step button{width:52px;min-height:52px;flex:none;border-radius:14px;background:var(--b);font-size:26px;font-weight:700;line-height:1}.step input{text-align:center;font-size:20px;font-weight:700}
.crow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b)}.crow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.crow .step input{width:76px}.crow .step button{width:42px;min-height:42px;font-size:22px}
</style></head>
<body>
<header id="top"><div class="brand"><div class="logo" id="logo"></div><h1>Zina Basicos</h1></div><div class="dates" id="dates"></div></header>
<div id="app"><main id="main" aria-live="polite"></main></div>
<div id="dock"><div id="fab" class="fab"></div>
<nav aria-label="Navegación principal" id="nav"></nav></div>
<div id="layer" class="layer" hidden></div>
<div id="shade" class="shade" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
"use strict";
/* ===== Iconos SVG integrados (sin dependencias) ===== */
const P={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',chart:'M4 20V10m6 10V4m6 16v-7m5 7H2',cog:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7.4-3a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14.5 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z',store:'M4 9l1-5h14l1 5M4 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 6 0 2.5 2.5 0 0 0 5 0M5 12v8h14v-8M10 20v-5h4v5',up:'M3 17l6-6 4 4 8-8M15 7h6v6',down:'M3 7l6 6 4-4 8 8M15 17h6v-6',dots:'M12 5h.01M12 12h.01M12 19h.01',back:'M15 18l-6-6 6-6',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',plus:'M12 5v14M5 12h14',count:'M9 4h6v3H9zM7 5H5v16h14V5h-2M9 14l2 2 4-4'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;

/* ===== Datos: localStorage (solo versión de prueba; importes en centavos enteros) =====
   S = {settings:{name,initial}, movs:[{id,type:'in'|'out',amount,desc,date,time,place,clientCat,cat,party,notes,created}], suppliers:[], clients:[]} */
const KEY='mi-negocio-v1';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.movs))return Object.assign({settings:{name:'Mi negocio',initial:0},suppliers:[],clients:[]},d)}catch(e){}
  return{settings:{name:'Mi negocio',initial:0},movs:[],suppliers:[],clients:[]}}
let mem=false;try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){mem=true}
let S=load();S.inv=S.inv||[];
/* Si el navegador bloquea localStorage, los datos quedan en memoria y se avisa en pantalla */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=true}return true}

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:2});
const fmt=c=>(c<0?'-':'')+'$ '+(Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
function parseMoney(v){v=String(v).trim().replace(/[^\d.,]/g,'');if(!v)return NaN;
  v=v.replace(/,/g,'');
  const n=Number(v);return isFinite(n)?Math.round(n*100):NaN}
const uid=()=>{try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2)}};
function dlabel(m){const y=iso(new Date(Date.now()-864e5));if(m.date===today())return 'Hoy'+(m.time?', '+m.time:'');if(m.date===y)return 'Ayer';return m.date.split('-').reverse().join('/')}
function inPer(d,p){const t=new Date(),ts=today();if(p==='day')return d===ts;if(p==='month')return d.slice(0,7)===ts.slice(0,7);if(p==='year')return d.slice(0,4)===ts.slice(0,4);
  const k=(t.getDay()+6)%7,a=new Date(t);a.setDate(t.getDate()-k);const b=new Date(a);b.setDate(a.getDate()+6);return d>=iso(a)&&d<=iso(b)}
/* Stock: suma (+1) o descuenta (-1) la cantidad vendida de un movimiento */
const stk=(m,s)=>{(m.items||(m.itemId?[{id:m.itemId,qty:m.qty}]:[])).forEach(x=>{const i=S.inv.find(y=>y.id===x.id);if(i)i.stock+=s*(x.qty||0)})};
const sum=(l,t)=>l.filter(m=>m.type===t).reduce((a,m)=>a+m.amount,0);
const sorted=l=>[...l].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
const avail=()=>S.settings.initial+sum(S.movs,'in')-sum(S.movs,'out');
const PER=[['day','Hoy'],['week','Esta semana'],['month','Este mes'],['year','Este año']];
const CLI=['Minorista','Mayorista','Cliente habitual','Otro'],CAT=['Mercadería','Transporte','Alquiler','Servicios','Sueldos','Otro'];

/* ===== Estado de UI ===== */
const U={tab:'home',ht:'in',hp:'day',mt:'all',mp:'month',sp:'month',sd:'',md:''};
let busy=false,pendingDel=null;
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className=bad?'bad':'';e.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>e.hidden=true,2600)}

/* ===== Vistas ===== */
const chips=(cur,act)=>`<div class="chips" role="group">${PER.map(([k,l])=>`<button class="chip${cur===k?' on':''}" data-a="${act}" data-v="${k}">${l}</button>`).join('')}</div>`;
function tabs(items,cur,act){return `<div class="tabs" role="tablist" style="--n:${items.length}">${items.map(([k,l])=>`<button role="tab" aria-selected="${cur===k}" class="${cur===k?'on':''}${k==='out'?' o':''}" data-a="${act}" data-v="${k}">${l}</button>`).join('')}</div>`}
function row(m){const o=m.type==='out';const sub=[dlabel(m),o?m.cat:(m.client!==m.desc?m.client:m.clientCat),o?(m.party&&'Proveedor: '+m.party):m.place].filter(Boolean).map(esc).join(' · ');
  return `<div class="row"><div class="tx"><b>${esc(m.desc)}</b><small>${sub}</small></div><span class="amt ${m.type}">${o?'−':'+'}${fmt(m.amount)}</span><button class="dots" data-a="menu" data-id="${m.id}" aria-label="Opciones de ${esc(m.desc)}">${ic('dots')}</button></div>`}
const emptyList=(t)=>`<div class="empty">${ic('list')}<b>Sin movimientos</b>${t}</div>`;

/* Compara los ingresos de hoy con los de ayer */
function vsY(per){const nw0=new Date(),Y=nw0.getFullYear(),M=nw0.getMonth(),D=nw0.getDate(),dt=(y,m,x)=>iso(new Date(y,m,x));let cu,pr,lb;
  /* Mismo tramo de tiempo en ambos períodos: lo que va de la semana/mes/año contra el período anterior hasta el mismo día */
  if(per==='week'){const k=(nw0.getDay()+6)%7;cu=[dt(Y,M,D-k),dt(Y,M,D)];pr=[dt(Y,M,D-k-7),dt(Y,M,D-7)];lb='la semana pasada'}
  else if(per==='month'){cu=[dt(Y,M,1),dt(Y,M,D)];pr=[dt(Y,M-1,1),dt(Y,M-1,Math.min(D,new Date(Y,M,0).getDate()))];lb='el mes pasado'}
  else if(per==='year'){cu=[dt(Y,0,1),dt(Y,M,D)];pr=[dt(Y-1,0,1),dt(Y-1,M,M===1&&D===29?28:D)];lb='el año pasado'}
  else{cu=[dt(Y,M,D),dt(Y,M,D)];pr=[dt(Y,M,D-1),dt(Y,M,D-1)];lb='ayer'}
  const at=r=>sum(S.movs.filter(m=>m.date>=r[0]&&m.date<=r[1]),'in');
  const p=at(pr),n=at(cu);let tx,c='var(--m)',i='';
  if(p===0)tx=n===0?'Sin ingresos todavía':'No hubo ingresos '+lb;
  else{const r=Math.round((n-p)/p*1000)/10,a=Math.abs(r),s=a%1?a.toFixed(1):String(a);
    if(r>0){tx=s+'% más que '+lb;c='var(--g2)';i=ic('up')}else if(r<0){tx=s+'% menos que '+lb;c='var(--r)';i=ic('down')}else tx='Igual que '+lb}
  return `<span style="display:inline-flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:11.5px;font-weight:700;color:${c};text-align:center">${i.replace('<svg','<svg style="width:14px;height:14px;color:'+c+'"')}${tx}</span>`}
/* Tarjeta de progreso de la meta mensual (solo si hay meta) */
function goalCard(){const g=S.settings.goal||0;if(!g||!S.settings.goalOn)return '';const v=sum(S.movs.filter(m=>inPer(m.date,'month')),'in'),r=Math.round(v/g*100),ok=v>=g;
  return `<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Meta del mes</b><b style="color:${ok?'var(--g2)':'var(--t)'}">${r}%</b></div><div style="height:10px;border-radius:99px;background:var(--b);margin:10px 0 8px;overflow:hidden"><div style="width:${Math.min(100,r)}%;height:100%;background:var(--g2);border-radius:99px"></div></div><small style="color:var(--m)">${fmt(v)} de ${fmt(g)} · ${ok?'¡Meta cumplida!':'faltan '+fmt(g-v)}</small></div>`}
function vHome(){const per=S.movs.filter(m=>inPer(m.date,U.hp)),list=sorted(S.movs.filter(m=>m.type===U.ht));
  const shown=list.slice(0,5);
  return `<h2 class="sec" style="margin:0 0 10px">Resumen total</h2>
  <section class="bal${avail()<0?' neg':''}"><small>BALANCE</small><div class="big">${fmt(avail())}</div></section>
  ${chips(U.hp,'hper')}
  <div class="two"><div class="card sum in"><span>${ic('up')}Ingresos</span><b>${fmt(sum(per,'in'))}</b>${vsY(U.hp)}</div><div class="card sum out"><span>${ic('down')}Egresos</span><b>${fmt(sum(per,'out'))}</b></div></div>
  ${goalCard()}
  <h2 class="sec">Últimos movimientos</h2>
  ${tabs([['in','Ingresos'],['out','Egresos']],U.ht,'htab')}
  <div class="card">${shown.length?shown.map(row).join(''):emptyList(U.ht==='in'?'Registrá tu primera venta.':'Registrá tu primer gasto.')}</div>
  ${list.length>5?`<button class="link" data-a="tab" data-v="mov">Ver todos los movimientos</button>`:''}
  `}

function vMov(){let l=sorted(S.movs.filter(m=>(U.md?m.date===U.md:inPer(m.date,U.mp))&&(U.mt==='all'||m.type===U.mt)));
  return `<header class="hd"><div><h1>Movimientos</h1><p>${l.length} en el período</p></div></header>
  ${tabs([['all','Todos'],['in','Ingresos'],['out','Egresos']],U.mt,'mtab')}${U.md?`<div class="chips"><span class="chip on">${U.md.split('-').reverse().join('/')}</span><button class="chip" data-a="mdclear">Quitar fecha</button></div>`:''}${chips(U.md?'':U.mp,'mper')}
  <div class="card">${l.length?l.map(row).join(''):emptyList('No hay movimientos con estos filtros.')}</div>`}

function vStats(){const l=S.movs.filter(m=>U.sd?m.date===U.sd:inPer(m.date,U.sp)),i=sum(l,'in'),o=sum(l,'out');
  let body;
  if(!S.movs.length)body=`<div class="card empty">${ic('chart')}<b>Todavía no hay datos</b>Registrá tu primera venta para ver tus estadísticas.</div>`;
  else if(!l.length)body=`<div class="card empty">${ic('chart')}<b>Sin movimientos en este período</b>Probá con otro período.</div>`;
  else if(U.sd)body=`<h2 class="sec">Movimientos del día</h2><div class="card">${sorted(l).map(row).join('')}</div>`;
  else{const yr=U.sp==='year',B={};l.forEach(m=>{const k=yr?m.date.slice(0,7):m.date;(B[k]=B[k]||{i:0,o:0})[m.type==='in'?'i':'o']+=m.amount});
    const ks=Object.keys(B).sort().slice(-12),mx=Math.max(...ks.map(k=>Math.max(B[k].i,B[k].o)));
    const lb=k=>{const p=k.split('-');return yr?p[1]+'/'+p[0].slice(2):p[2]+'/'+p[1]};
    body=`<div class="card"><div class="chart" role="img" aria-label="Ingresos frente a egresos">${ks.map(k=>`<div class="bk"><div class="bars"><i class="i" style="height:${B[k].i/mx*100}%"></i><i class="o" style="height:${B[k].o/mx*100}%"></i></div>${lb(k)}</div>`).join('')}</div>
    <p style="font-size:13px;color:var(--m);margin-top:8px">Verde: ingresos · Rojo: egresos</p></div>
    <h2 class="sec">Historial del período</h2><div class="card">${[...ks].reverse().map(k=>`<div class="kv"><span>${lb(k)}</span><span><b class="amt in">+${fmt(B[k].i)}</b> &nbsp; <b class="amt out">−${fmt(B[k].o)}</b></span></div>`).join('')}</div>`}
  return `<header class="hd"><div><h1>Estadísticas</h1><p>Calculadas con tus movimientos</p></div></header>${chips(U.sd?'':U.sp,'sper').replace(/Hoy/,'Día').replace('Esta semana','Semana').replace('Este mes','Mes').replace('Este año','Año')}<div class="card" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><label for="sd" style="margin:0;white-space:nowrap">Ver un día</label><input id="sd" type="date" value="${U.sd}">${U.sd?'<button class="chip" data-a="sdclear">Quitar</button>':''}</div>
  <div class="two"><div class="card sum in"><span>${ic('up')}Ingresos</span><b>${fmt(i)}</b></div><div class="card sum out"><span>${ic('down')}Egresos</span><b>${fmt(o)}</b></div></div>
  <div class="card sum" style="margin:12px 0"><span>Resultado neto</span><b style="color:${i-o<0?'var(--r)':'var(--g2)'}">${fmt(i-o)}</b></div>${body}`}

function vSet(){const sw=(k,t,d)=>`<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div style="flex:1"><b>${t}</b><p style="color:var(--m);font-size:14px">${d}</p></div><button class="sw${S.settings[k]?' on':''}" role="switch" aria-checked="${!!S.settings[k]}" aria-label="${t}" data-a="tog" data-v="${k}"><i></i></button></div>`;
  return `<header class="hd"><div><h1>Ajustes</h1></div></header>${sw('dark','Modo oscuro','Fondo negro para usar de noche.')}${sw('inv','Habilitar inventario','Agrega la sección Inventario y permite elegir productos al vender.')}${sw('goalOn','Habilitar meta mensual','Muestra en Inicio tu progreso de ventas del mes.')}${setForms()}`}
/* Saldo inicial y meta mensual (importes con comas automáticas) */
function setForms(){const nf2=c=>c?(c/100).toLocaleString('en-US',{maximumFractionDigits:2}):'';
  const f=(id,t,d,n,v,e,b)=>`<form id="${id}" class="card" novalidate style="margin-bottom:12px"><b>${t}</b><p style="color:var(--m);font-size:14px;margin-bottom:10px">${d}</p><input class="money" name="${n}" inputmode="numeric" placeholder="$ 0" autocomplete="off" aria-label="${t}" value="${nf2(v)}"><small class="err" id="${e}"></small><button class="btn" style="width:100%;margin-top:8px">${b}</button></form>`;
  return f('sf','Saldo inicial','Con cuánta plata arrancás. Se suma al balance.','initial',S.settings.initial,'se','Guardar saldo inicial')+(S.settings.goalOn?f('gf','Meta mensual de ventas','Tu objetivo de ingresos por mes. Dejalo vacío para quitarla.','goal',S.settings.goal,'ge','Guardar meta'):'')}
function vSetOld(){return `<header class="hd"><div><h1>Ajustes</h1><p>Configuración y copia de datos</p></div></header>
  <form id="sf" class="card" novalidate><label for="sn" style="margin-top:0">Nombre del negocio</label><input id="sn" name="name" value="${esc(S.settings.name)}" maxlength="40">
  <label for="si">Saldo inicial (ARS)</label><input id="si" name="initial" inputmode="decimal" value="${(S.settings.initial/100).toString().replace('.',',')}"><small class="err" id="se"></small>
  <button class="btn" style="width:100%;margin-top:8px">Guardar ajustes</button></form>
  <h2 class="sec">Copia de seguridad</h2><div class="card"><p style="color:var(--m);font-size:14px">Copiá este texto para guardar tus datos, o pegá una copia y tocá Importar (reemplaza lo actual).</p>
  <label for="ex">Datos (JSON)</label><textarea id="ex" class="box" spellcheck="false">${esc(JSON.stringify(S))}</textarea>
  <div class="acts"><button class="btn ghost" data-a="copy">Copiar</button><button class="btn" data-a="import">Importar</button></div></div>
  <div class="acts"><button class="btn dng" data-a="reset" style="grid-column:1/-1">Borrar todos los datos</button></div>`}

/* ===== Inventario ===== */
function vInv(){const l=[...S.inv].sort((a,b)=>a.name.localeCompare(b.name)),u=l.reduce((a,i)=>a+i.stock,0),v=l.reduce((a,i)=>a+i.price*i.stock,0);
  return `<header class="hd"><div><h1>Inventario</h1><p>${l.length} productos</p></div></header><div class="two" style="margin-bottom:12px"><div class="card sum in"><span>${ic('box')}Productos total</span><b>${u}</b></div><div class="card sum"><span>Costo total</span><b>${fmt(v)}</b></div></div><div class="card">${l.length?l.map(i=>`<div class="row"><div class="tx"><b>${esc(i.name)}</b><small>Stock: <span style="color:${i.stock<=0?'var(--r)':'inherit'}">${i.stock}</span></small></div><span class="amt">${fmt(i.price)}</span><button class="dots" data-a="itemmenu" data-id="${i.id}" aria-label="Opciones de ${esc(i.name)}">${ic('dots')}</button></div>`).join(''):`<div class="empty">${ic('box')}<b>Sin productos</b>Agregá tu primer producto con su precio y stock.</div>`}</div>`}
function openItem(id){const i=(id&&S.inv.find(x=>x.id===id))||{};const L=$('#layer');L.hidden=false;document.body.style.overflow='hidden';
  L.innerHTML=`<div class="ctr"><div class="fh"><button class="ib" type="button" data-a="back" aria-label="Volver">${ic('back')}</button></div><form id="if" class="fcard" autocomplete="off" novalidate data-id="${id||''}"><div class="ficon">${ic('box')}</div><h2>${id?'Editar producto':'Nuevo producto'}</h2><p class="sub">Cargá el nombre, el precio y las unidades que tenés.</p>
  <label for="in">Nombre del producto</label><input id="in" name="name" autocomplete="off" maxlength="60" placeholder="Ej: Una remerita de boca" value="${esc(i.name||'')}"><small class="err" id="e1"></small>
  <label for="fa">Precio</label><div class="pf"><span>$</span><input id="fa" name="price" class="amtin" inputmode="numeric" placeholder="0" autocomplete="off" value="${i.price?(i.price/100).toLocaleString('en-US',{maximumFractionDigits:2}):''}"></div><small class="err" id="ea"></small>
  <label for="is">Stock (unidades)</label><div class="step"><button type="button" data-a="stk" data-t="is" data-v="-1" aria-label="Restar">−</button><input id="is" name="stock" inputmode="numeric" value="${i.stock??''}"><button type="button" data-a="stk" data-t="is" data-v="1" aria-label="Sumar">+</button></div><small class="err" id="e2"></small>
  <div class="acts"><button type="button" class="btn ghost" data-a="back">Cancelar</button><button class="btn">${id?'Guardar cambios':'Guardar producto'}</button></div></form></div>`;try{history.pushState({f:1},'')}catch(e){}}
function submitItem(f){const d=Object.fromEntries(new FormData(f)),pr=parseMoney(d.price),st=Math.floor(Number(d.stock));let bad=0;
  ['e1','ea','e2'].forEach(k=>$('#'+k).textContent='');
  if(!d.name.trim()){$('#e1').textContent='Escribí el nombre del producto.';bad=1}
  if(d.price===''||!(pr>=0)){$('#ea').textContent='Ingresá el precio.';bad=1}
  if(d.stock===''||!(st>=0)){$('#e2').textContent='Ingresá el stock (0 o más).';bad=1}
  if(bad)return;const rec={name:d.name.trim(),price:pr,stock:st};
  if(f.dataset.id)Object.assign(S.inv.find(x=>x.id===f.dataset.id),rec);else S.inv.push(Object.assign({id:uid()},rec));
  save();closeForm();render();toast('Producto guardado')}
/* Conteo de stock: edita las cantidades de todos los productos en un solo formulario */
function openCount(){const L=$('#layer');L.hidden=false;document.body.style.overflow='hidden';
  L.innerHTML=`<div class="ctr"><div class="fh"><button class="ib" type="button" data-a="back" aria-label="Volver">${ic('back')}</button><h2>Conteo de stock</h2></div>
  <form id="cf" class="fcard" novalidate>${S.inv.length?`<p style="color:var(--m);font-size:14px">Poné la cantidad real que tenés de cada producto.</p>`+[...S.inv].sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<div class="crow"><b>${esc(i.name)}</b><div class="step"><button type="button" data-a="stk" data-t="c_${i.id}" data-v="-1" aria-label="Restar">−</button><input id="c_${i.id}" name="${i.id}" inputmode="numeric" value="${i.stock}" aria-label="${esc(i.name)}"><button type="button" data-a="stk" data-t="c_${i.id}" data-v="1" aria-label="Sumar">+</button></div></div>`).join('')+`<small class="err" id="ec"></small><div class="acts"><button type="button" class="btn ghost" data-a="back">Cancelar</button><button class="btn">Guardar conteo</button></div>`:`<div class="empty">${ic('box')}<b>Sin productos</b>Creá un producto para poder contar el stock.</div>`}</form></div>`;
  try{history.pushState({f:1},'')}catch(e){}}
function submitCount(f){const v={};for(const i of S.inv){const r=f.elements[i.id].value.trim(),n=Math.floor(Number(r));if(r===''||!(n>=0)){$('#ec').textContent='Revisá "'+i.name+'": ingresá un número (0 o más).';f.elements[i.id].focus();return}v[i.id]=n}
  S.inv.forEach(i=>i.stock=v[i.id]);save();closeForm();render();toast('Conteo guardado')}
function itemMenu(id){const i=S.inv.find(x=>x.id===id);if(!i)return;sheet(`<h3>${esc(i.name)}</h3><button class="opt" data-a="itemedit" data-id="${id}">${ic('edit')}Editar</button><button class="opt d" data-a="itemdel" data-id="${id}">${ic('trash')}Eliminar</button>`)}
function itemDel(id){const i=S.inv.find(x=>x.id===id);if(!i)return;sheet(`<h3>Eliminar producto</h3><p>¿Querés eliminar ${esc(i.name)} del inventario? Las ventas ya registradas no se modifican.</p><div class="acts"><button class="btn ghost" data-a="close">Cancelar</button><button class="btn dng" data-a="itemdelok" data-id="${id}">Sí, eliminar</button></div>`,1)}

/* ===== Formularios (pantalla completa dentro de la app) ===== */
function openForm(type,id){const m=id?S.movs.find(x=>x.id===id):null,o=type==='out',v=m||{};
  const opts=(a,c)=>`<option value="">— Elegir —</option>`+a.map(x=>`<option${x===c?' selected':''}>${x}</option>`).join('');
  const L=$('#layer');L.hidden=false;document.body.style.overflow='hidden';
  L.innerHTML=`<div class="fx"><form id="mf" autocomplete="off" novalidate data-type="${type}" data-id="${m?m.id:''}"><div class="fxh${o?' out':''}"><div class="fxt"><button class="ib" type="button" data-a="back" aria-label="Volver">${ic('back')}</button><b>${m?(o?'Editar gasto':'Editar venta'):(o?'Nuevo gasto':'Nueva venta')}</b></div><label for="fa">Importe</label><div class="pf2"><span>$</span><input id="fa" name="amount" inputmode="numeric" placeholder="0" autocomplete="off" value="${m?(m.amount/100).toLocaleString('en-US',{maximumFractionDigits:2}):''}"></div><small class="err" id="ea"></small></div><div class="fxb">
  <label for="ff">Fecha</label><input id="ff" name="date" type="date" value="${v.date||today()}"><small class="err" id="ef"></small>
  
  ${o?`<label for="fd">Producto</label><input id="fd" name="desc" autocomplete="off" maxlength="80" value="${esc(v.desc||'')}"><small class="err" id="e1"></small>
  <label for="fp">Proveedor (opcional)</label><input id="fp" name="party" autocomplete="off" maxlength="60" value="${esc(v.party||'')}"><datalist id="sup">${S.suppliers.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <label for="fn">Nota (opcional)</label><textarea id="fn" name="notes" rows="2" maxlength="200">${esc(v.notes||'')}</textarea>`
  :`<label for="fc">Cliente</label><input id="fc" name="client" autocomplete="off" maxlength="60" value="${esc(v.client||'')}"><small class="err" id="e1"></small>
  ${S.settings.inv?`<label>Productos del inventario</label><div id="il"></div><button type="button" class="chip" id="al" data-a="addline">+ Agregar producto</button><small class="err" id="e4"></small>`:''}
  <label for="fd">Producto</label><input id="fd" name="desc" autocomplete="off" maxlength="80" value="${esc(v.desc||'')}"><small class="err" id="e3"></small><div id="xp"></div><button type="button" class="chip" id="ap" data-a="addp">${S.settings.inv?'+ Agregar producto nuevo':'+ Agregar otro producto'}</button>
  <label for="fl">Lugar de entrega</label><input id="fl" name="place" maxlength="60" autocomplete="off" value="${esc(v.place||'')}">
  <small class="err" id="e2"></small>
  <label for="fn">Nota (opcional)</label><textarea id="fn" name="notes" rows="2" maxlength="200">${esc(v.notes||'')}</textarea>`}
  <div class="acts"><button type="button" class="btn ghost" data-a="back">Cancelar</button><button class="btn${o?' red':''}">${m?'Guardar cambios':(o?'Guardar gasto':'Guardar venta')}</button></div></div></form></div>`;
  if(S.settings.inv&&!o)(v.items||(v.itemId?[{id:v.itemId,qty:v.qty}]:[])).forEach(x=>addLine(x.id,x.qty));
  if(S.settings.inv&&!o&&v.items&&v.items.length&&v.xt)v.xt.forEach(x=>addX(x));
  try{history.pushState({f:1},'')}catch(e){}setTimeout(()=>$('#fa')&&$('#fa').focus(),50)}
/* Venta con varios productos del inventario: cada línea tiene producto + cantidad; el importe y el nombre se completan solos */
function addLine(id,q){const d=document.createElement('div');d.className='il';
  d.innerHTML=`<select name="itemId" aria-label="Producto"><option value="">— Elegir producto —</option>${S.inv.map(i=>`<option value="${i.id}"${id===i.id?' selected':''}>${esc(i.name)} · ${fmt(i.price)} · stock ${i.stock}</option>`).join('')}</select><div class="step"><button type="button" data-a="lq" data-v="-1" aria-label="Restar">−</button><input name="qty" inputmode="numeric" value="${q||1}" aria-label="Cantidad"><button type="button" data-a="lq" data-v="1" aria-label="Sumar">+</button></div><button type="button" class="dots" data-a="lrm" aria-label="Quitar producto">${ic('trash')}</button>`;
  $('#il').appendChild(d);sumLines();lblAdd()}
function addX(t){const d=document.createElement('div');d.className='il';d.innerHTML='<input name="xdesc" autocomplete="off" maxlength="80" placeholder="Otro producto" aria-label="Otro producto" style="flex:1 1 0;min-width:0" value="'+esc(t||'')+'"><button type="button" class="dots" data-a="lrm" aria-label="Quitar producto">'+ic('trash')+'</button>';$('#xp').appendChild(d);if(t===undefined)d.querySelector('input').focus()}
function lblAdd(){const b=$('#al');if(b)b.textContent=document.querySelector('#il .il')?'+ Agregar otro producto':'+ Agregar producto'}
function sumLines(){let t=0;const n=[];document.querySelectorAll('#il .il').forEach(r=>{const p=S.inv.find(x=>x.id===r.querySelector('select').value);if(!p)return;const q=Math.max(1,Math.floor(Number(r.querySelector('.step input').value))||1);t+=p.price*q;n.push(p.name+(q>1?' x'+q:''))});
  if(!n.length)return;$('#fa').value=(t/100).toLocaleString('en-US',{maximumFractionDigits:2});$('#fd').value=n.join(', ')}
let skipPop=false;
function closeForm(p){$('#layer').hidden=true;$('#layer').innerHTML='';document.body.style.overflow='';if(!p){try{if(history.state&&history.state.f){skipPop=true;history.back()}}catch(e){}}}

function submitForm(f){if(busy)return;const fd=new FormData(f),d=Object.fromEntries(fd),o=f.dataset.type==='out',id=f.dataset.id;
  const a=parseMoney(d.amount);let bad=false;$('#ea').textContent='';$('#ef').textContent='';
  if(!(a>0)){$('#ea').textContent='Ingresá un importe mayor que cero.';bad=true}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')){$('#ef').textContent='Elegí una fecha válida.';bad=true}
  const nm=[d.desc.trim()].concat(fd.getAll('xdesc').map(x=>x.trim())).filter(Boolean).join(', '),cl=o?'':d.client.trim();$('#e1').textContent='';if(o){if(!nm){$('#e1').textContent='Escribí el producto.';bad=true}}else{$('#e3').textContent='';if(!cl){$('#e1').textContent='Escribí el cliente.';bad=true}if(!nm){$('#e3').textContent='Escribí el producto.';bad=true}}
  if(!o){$('#e2').textContent='';if(!d.place.trim()){$('#e2').textContent='Escribí el lugar de entrega.';bad=true}}
  if(bad)return;
  const mg={};if(!o)fd.getAll('itemId').forEach((x,k)=>{if(x&&S.inv.find(y=>y.id===x))mg[x]=(mg[x]||0)+(Math.floor(Number(fd.getAll('qty')[k]))||1)});
  const old=id?S.movs.find(x=>x.id===id):null,oq=old?(old.items||(old.itemId?[{id:old.itemId,qty:old.qty}]:[])):[];
  const its=Object.keys(mg).map(k=>{const p=S.inv.find(y=>y.id===k);return{id:k,name:p.name,price:p.price,qty:mg[k]}});
  for(const x of its){const p=S.inv.find(y=>y.id===x.id),have=p.stock+oq.filter(z=>z.id===x.id).reduce((a,z)=>a+(z.qty||0),0);if(x.qty>have){$('#e4').textContent='Stock insuficiente de '+p.name+' (hay '+have+').';return}}
  busy=true;const t=nm;
  const rec=o?{amount:a,desc:t,date:d.date,party:d.party.trim(),notes:d.notes.trim()}:{amount:a,desc:t,client:cl,date:d.date,place:d.place.trim(),notes:d.notes.trim(),items:its,xt:its.length?fd.getAll('xdesc').map(x=>x.trim()).filter(Boolean):[]};
  const before=JSON.stringify(S);
  if(id){const m=S.movs.find(x=>x.id===id);if(!m){busy=false;return toast('No se encontró el movimiento',1)}stk(m,1);Object.assign(m,rec);stk(m,-1)}
  else{const n=new Date();S.movs.push(Object.assign({id:uid(),type:f.dataset.type,time:pad(n.getHours())+':'+pad(n.getMinutes()),created:Date.now()},rec));stk(S.movs[S.movs.length-1],-1)}
  if(o&&rec.party&&!S.suppliers.includes(rec.party))S.suppliers.push(rec.party);
  if(!o&&rec.place&&!S.clients.includes(rec.place))S.clients.push(rec.place);
  if(!save()){S=JSON.parse(before);busy=false;return}
  closeForm();render();toast(id?'Cambios guardados':(o?'Gasto guardado':'Venta guardada'));setTimeout(()=>busy=false,400)}

/* ===== Hojas: menú, detalle y confirmación ===== */
function sheet(h,mid){const s=$('#shade');s.className='shade'+(mid?' mid':'');s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;s.hidden=false}
const closeSheet=()=>{$('#shade').hidden=true;$('#shade').innerHTML=''};
const kind=m=>m.type==='out'?'gasto':'venta';
function menu(id){const m=S.movs.find(x=>x.id===id);if(!m)return;
  sheet(`<h3>${esc(m.desc)} · ${fmt(m.amount)}</h3><button class="opt" data-a="detail" data-id="${id}">${ic('eye')}Ver detalle</button><button class="opt" data-a="edit" data-id="${id}">${ic('edit')}Editar</button><button class="opt d" data-a="del" data-id="${id}">${ic('trash')}Eliminar</button>`)}
function detail(id){const m=S.movs.find(x=>x.id===id);if(!m)return;const o=m.type==='out';
  const r=[['Tipo',o?'Gasto (egreso)':'Venta (ingreso)'],['Importe',(o?'−':'+')+fmt(m.amount)],['Producto',m.desc],m.items&&m.items.length?['Del inventario',m.items.map(x=>x.name+' x'+x.qty).join(', ')]:null,['Fecha',dlabel(m)],o?['Proveedor',m.party]:['Cliente',m.client],o?null:['Lugar de entrega',m.place],['Nota',m.notes]].filter(x=>x&&x[1]);
  sheet(`<h3>Detalle</h3><dl>${r.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="acts"><button class="btn ghost" data-a="close">Cerrar</button><button class="btn" data-a="edit" data-id="${id}">Editar</button></div>`)}
function confirmDel(id){const m=S.movs.find(x=>x.id===id);if(!m)return;pendingDel=id;
  sheet(`<h3>Eliminar ${kind(m)}</h3><p>¿Querés eliminar ${m.type==='out'?'este gasto':'esta venta'} de ${fmt(m.amount)}? Esta acción no se puede deshacer.</p><div class="acts"><button class="btn ghost" data-a="close">Cancelar</button><button class="btn dng" data-a="delok">Sí, eliminar</button></div>`,1)}
function confirmReset(){sheet(`<h3>Borrar todos los datos</h3><p>Se eliminarán movimientos, saldo inicial y configuración. Esta acción no se puede deshacer.</p><div class="acts"><button class="btn ghost" data-a="close">Cancelar</button><button class="btn dng" data-a="resetok">Sí, borrar</button></div>`,1)}

document.addEventListener('click',e=>{if(e.target.id==='layer'){closeForm();return}const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
  if(a==='tab'){if(v==='home'&&history.state&&history.state.t){history.back();return}pushT();U.tab=v;U.md='';render();scrollTo(0,0)}
  else if(a==='htab'){U.ht=v;render()}else if(a==='mtab'){U.mt=v;render()}
  else if(a==='hper'){U.hp=v;render()}else if(a==='mper'){U.mp=v;U.md='';render()}else if(a==='mdclear'){U.md='';render()}else if(a==='day'){pushT();U.md=v;U.tab='mov';render();scrollTo(0,0)}else if(a==='sper'){U.sp=v;U.sd='';render()}else if(a==='sdclear'){U.sd='';render()}
  else if(a==='new')openForm(v);
  else if(a==='tog'){S.settings[v]=!S.settings[v];if(v==='inv'&&!S.settings.inv&&U.tab==='inv')U.tab='set';save();render()}
  else if(a==='itemnew')openItem();else if(a==='count')openCount();else if(a==='addline')addLine();else if(a==='addp')addX();else if(a==='pick'){if(!S.inv.length){toast('Primero creá productos en Inventario',1)}else sheet(`<h3>Elegí los productos</h3><div style="max-height:50vh;overflow:auto">${[...S.inv].sort((x,y)=>x.name.localeCompare(y.name)).map(i=>`<label class="pk"><input type="checkbox" value="${i.id}"${i.stock<=0?' disabled':''}><span><b>${esc(i.name)}</b><small>${fmt(i.price)} · stock ${i.stock}</small></span></label>`).join('')}</div><div class="acts"><button class="btn ghost" data-a="close">Cancelar</button><button class="btn" data-a="pickok">Agregar</button></div>`)}
  else if(a==='pickok'){const have=[...document.querySelectorAll('#il select')].map(s=>s.value);document.querySelectorAll('#shade .pk input:checked').forEach(c=>{if(!have.includes(c.value))addLine(c.value)});closeSheet()}else if(a==='lq'){const inp=b.parentElement.querySelector('input');inp.value=Math.max(1,(Math.floor(Number(inp.value))||1)+Number(v));sumLines()}else if(a==='lrm'){b.closest('.il').remove();sumLines();lblAdd()}else if(a==='stk'){const el=document.getElementById(b.dataset.t);if(el)el.value=Math.max(0,(Math.floor(Number(el.value))||0)+Number(v))}else if(a==='itemmenu')itemMenu(id);else if(a==='itemedit'){closeSheet();openItem(id)}else if(a==='itemdel')itemDel(id);
  else if(a==='itemdelok'){S.inv=S.inv.filter(x=>x.id!==id);save();closeSheet();render();toast('Producto eliminado')}
  else if(a==='back')closeForm();
  else if(a==='menu')menu(id);
  else if(a==='detail')detail(id);
  else if(a==='edit'){closeSheet();openForm(S.movs.find(x=>x.id===id).type,id)}
  else if(a==='del')confirmDel(id);
  else if(a==='delok'){const n=S.movs.length;S.movs.filter(x=>x.id===pendingDel).forEach(m=>stk(m,1));S.movs=S.movs.filter(x=>x.id!==pendingDel);const k=n>S.movs.length;pendingDel=null;closeSheet();if(k&&save()){render();toast('Movimiento eliminado')}else render()}
  else if(a==='close')closeSheet();
  else if(a==='copy'){const t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Datos copiados'),()=>toast('Seleccionado: copialo manualmente'))}catch(x){toast('Seleccionado: copialo manualmente')}}
  else if(a==='import'){try{const d=JSON.parse($('#ex').value);if(!d||!Array.isArray(d.movs)||!d.settings)throw 0;
    const ok=d.movs.every(m=>m&&typeof m.id==='string'&&(m.type==='in'||m.type==='out')&&Number.isInteger(m.amount)&&m.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(m.date));if(!ok||!Number.isInteger(d.settings.initial))throw 0;
    S=Object.assign({suppliers:[],clients:[]},d);S.movs.forEach((m,i)=>{m.desc=m.desc||'Movimiento';m.created=m.created||i});if(save()){render();toast('Datos importados')}}catch(x){toast('El texto no es una copia válida',1)}}
  else if(a==='reset')confirmReset();
  else if(a==='resetok'){S={settings:{name:'Mi negocio',initial:0},movs:[],suppliers:[],clients:[]};save();closeSheet();render();toast('Datos borrados')}});
$('#shade').addEventListener('click',e=>{if(e.target.id==='shade')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#shade').hidden)closeSheet();else if(!$('#layer').hidden)closeForm()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='mf')submitForm(f);else if(f.id==='if')submitItem(f);else if(f.id==='cf')submitCount(f);
  else if(f.id==='sf'){const i=parseMoney(f.initial.value||'0');if(isNaN(i)||i<0){$('#se').textContent='Ingresá un saldo válido (0 o más).';return}
    S.settings.initial=i;save();render();toast('Saldo inicial guardado')}
  else if(f.id==='gf'){const g=parseMoney(f.goal.value||'0');if(isNaN(g)||g<0){$('#ge').textContent='Ingresá una meta válida (0 o más).';return}
    S.settings.goal=g;save();render();toast(g?'Meta guardada':'Meta quitada')}});
/* Sin zoom, sin menú de copiar/pegar fuera de los campos; filtro por día */
document.addEventListener('gesturestart',e=>e.preventDefault());
/* Con el teclado abierto se oculta el menú de abajo y el campo queda centrado, con su botón Guardar a la vista */
const typing=()=>{const a=document.activeElement||{};return /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='date'};
/* El botón de agregar producto no le quita el foco al campo, así el teclado no se cierra */
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-a="addp"]'))e.preventDefault()});
function kbFix(){try{const a=document.activeElement,sc=a&&a.closest('.fx');if(!sc)return;const v=window.visualViewport,vb=v?v.offsetTop+v.height:innerHeight,t=a.closest('#xp')||a.id==='fd'?$('#ap'):a.closest('#il')?$('#al'):a,o=(t||a).getBoundingClientRect().bottom-(vb-24);if(o>0)sc.scrollTop+=o}catch(e){}}
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(typing())kbFix()});
function kb(){document.body.classList.toggle('kb',typing());if(typing())setTimeout(()=>{try{if(document.activeElement.closest('.fx')){kbFix();setTimeout(kbFix,350);return}const a=document.activeElement,f=a.closest('form')||a,h=window.visualViewport?visualViewport.height:innerHeight;(f.offsetHeight<h-130?f:a).scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}},300)}
document.addEventListener('focusin',kb);document.addEventListener('focusout',()=>setTimeout(()=>document.body.classList.toggle('kb',typing()),150));
/* Botón/gesto "atrás" del teléfono = Cancelar dentro de un formulario */
window.addEventListener('popstate',()=>{if(skipPop){skipPop=false;return}if(!$('#layer').hidden)closeForm(1);else if(U.tab!=='home'){U.tab='home';U.md='';render();scrollTo(0,0)}});
/* Importe con comas automáticas: 10,000 */
document.addEventListener('input',e=>{const el=e.target;if(el.id!=='fa'&&!el.classList.contains('money'))return;const p=el.value.replace(/[^\d.]/g,'').split('.');const ip=p[0].replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,',');el.value=p.length>1?ip+'.'+p.slice(1).join('').slice(0,2):ip});
/* Al elegir un producto de inventario se completan producto e importe (precio × cantidad) */
function fillItem(){const s=$('#fi');if(!s)return;const it=S.inv.find(x=>x.id===s.value);if(!it)return;const q=Math.max(1,Math.floor(Number($('#fq').value))||1);$('#fd').value=it.name;$('#fa').value=(it.price*q/100).toLocaleString('en-US',{maximumFractionDigits:2})}
document.addEventListener('change',e=>{if(e.target.closest('.il'))sumLines()});
document.addEventListener('input',e=>{if(e.target.closest('.il'))sumLines()});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
document.addEventListener('change',e=>{if(e.target.id==='sd'){U.sd=e.target.value;render()}else if(e.target.id==='cd'&&e.target.value){pushT();U.md=e.target.value;U.tab='mov';render();scrollTo(0,0)}});
render();
/* Instalación como app (PWA): registra el service worker si el navegador lo permite */
try{if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
</script>
</body></html>
